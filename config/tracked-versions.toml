# nginx release-manager GPG public keys. nginx.org publishes a detached .asc per
# source tarball (no .sha256), so the nginx-unix recipe imports the committed
# scripts/devxdk_manifest/keys/nginx/*.key into an ISOLATED keyring, asserts the
# keyring holds EXACTLY these fingerprints, and gpg-verifies the tarball's .asc.
