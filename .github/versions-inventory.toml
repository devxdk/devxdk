# DevXDK manifest repo - the version inventory.
#
# Read by scripts/ci/check_versions.py in two modes:
#   * versions-consistency.yml (pull_request + push, OFFLINE) - every row is
#     still where it says, in the declared number of places, all sites agree,
#     and nothing pin-shaped in this tree is missing from the file.
#   * versions-currency.yml (schedule + workflow_dispatch, NETWORKED) - every
#     row is compared to the authoritative API the row itself names.
#
# THIS REPO HAS NO DEPENDABOT. There is no .github/dependabot.yml here, so
# unlike the app repo every pin is inventory-or-nothing: this file is the ONLY
# thing that can notice a pin drifting. It therefore enumerates the FULL set -
# every workflow pin AND every config/tracked-versions.toml [pins.*] row - not
# just the ones that happened to be stale when it was written.
#
# Seven rows need a policy other than "track latest"; each says which and why.
# Two rows are EXCEPTIONS, and the two kinds are different:
#   * a HOLD carries a testable `condition` and NO date (blocked by something
#     outside our control);
#   * a TIME-BOUNDED exception carries an `expires_on` and NO condition (blocked
#     by our own verification cost, which a condition would never clear on its
#     own). The consistency job FAILS past that date.
# Never both, never neither - check_versions.validate_inventory enforces it.

schema = 1

# ---------------------------------------------------------------------------
# What the reverse scan walks.
# ---------------------------------------------------------------------------
[scan]
include_globs = [
  ".github/workflows/*.yml",
  "**/*.sh",
  "**/*.py",
  "**/*.md",
  "**/go.mod",
  "*.yml",
]
# `tests` is excluded for the same reason the AST guard excludes it: a test that
# asserts a floating ref is REJECTED has to contain one, and a scanner that read
# its own fixtures would fail on the proof that it works.
exclude_dirs = [".git", "__pycache__", "node_modules", "vendor", "tests"]
digest_globs = ["keys/*.sha256"]
# The structured [pins.*] walk. A regex over TOML would miss a nested table -
# [pins.php_redis.dll."8.5"] is exactly that shape - which is the one thing this
# walk exists for.
pins_file = "config/tracked-versions.toml"

# ---------------------------------------------------------------------------
# Deliberately floating - the ABSENCE of a pin, not a pin we track.
# ---------------------------------------------------------------------------
[[allowlist]]
select_kind = "runs-on"
select_values = ["ubuntu-latest", "windows-latest", "macos-latest"]

[[allowlist]]
# runs-on: ${{ inputs.runner }} in the reusable leg workflow. The VALUE is
# pinned at each caller by the `runner:` input rows below, which is where the
# dated label actually lives; treating the expression as unpinned would flag the
# indirection instead of the pin.
select_kind = "runs-on-indirect"

[[allowlist]]
# Local composite / reusable workflows: `./...` has no upstream to pin to.
select_kind = "uses-local"

# ===========================================================================
# GitHub Actions - SHA-pinned, tracked at latest release.
#
# `value` is the 40-hex commit (what the file must literally carry); `version`
# is the release tag it claims to be. The currency job proves BOTH: that the tag
# is still latest, and that the tag still resolves to that commit - a
# correct-looking version comment beside a wrong commit is exactly what a
# version-only comparison cannot see.
# ===========================================================================

