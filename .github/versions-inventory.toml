# ===========================================================================
# Build pins - version + digest as ONE unit.
#
# These are the half an inventory is most likely to miss and the most expensive
# to miss: OpenSSL, PCRE2 and zlib are STATICALLY COMPILED INTO the nginx we
# ship, and static-php-cli builds the PHP bundle. A stale pin here is not a
# CI-hygiene item, it is a shipped-binary CVE.
#
# WHAT THESE ROWS DO NOT PROVE. They assert the version+digest coupling and
# NOTHING about the shipped bytes. There is no durable artifact a scheduled
# scanner could read to prove which zlib is inside a published asset: the leg
# .meta.json that records it is neither published nor committed. So between
# publications this gate can prove the PIN is current and cannot prove the
# ARTIFACT was built from it. That gap is closed at BUILD time instead, by the
# static-pin provenance validator in scripts/publish_legs.py - and it is why a
# static-source pin bump is an obligation of the bump procedure (bump the pin,
# then force-rebuild at the next -rN) rather than something left for a scanner.
# ===========================================================================

[[rows]]
id = "pins-openssl"
why = "Statically linked into the three DevXDK-built unix nginx bundles (recipes/nginx.sh is the ONLY reader of this pin - redis/valkey take OpenSSL from the runner's package manager, and in php-spc 'openssl' is an extension NAME, so a grep for the word is misleading)"
value = "3.5.7"
[[rows.checks]]
kind = "scan"
select_kind = "toml-pin"
select_identity = "pins.openssl"
count = 2
# Coverage only: this table's fields are a version and its digest(s),
# which cannot share one expected value.
assert_value = false
[[rows.checks]]
# The version field itself, which DOES have to equal the row.
kind = "scan"
select_kind = "toml-pin"
select_identity = "pins.openssl.version"
count = 1
[rows.currency]
api = "github-release"
source = "openssl/openssl"
policy = "series"
series = "3.5"
series_note = "3.5 is the reviewed LTS line, supported to April 2030. Changing series is a BUILD decision (ABI, --api, the recipes' configure flags), not a currency bump, and this gate must not be able to force it: a row that compared against the newest release would report the pin two series behind on arrival, and a gate that is red on arrival gets its row weakened"
compare_value = "openssl-3.5.7"

